meta:
  name: Tyler Pollard
  description: "Statistician and operations research analyst focused on Bayesian modeling, predictive analytics, and data visualization."
  link:
    # home: https://your-domain.com # TODO: add your main site URL
    github: https://github.com/TylerPollard410
    linkedin: https://www.linkedin.com/in/tyler-pollard-763b8315b/
    email: mailto:tylerpollard410@gmail.com

logo:
  # Shared assets for Quarto + Bootstrap/Shiny projects.
  images:
    icon:
      path: logos/tyler-pollard-icon.png
      alt: "Tyler Pollard icon"
    header-logo:
      path: logos/tyler-pollard-header-logo.png
      alt: "Tyler Pollard"
    header-logo-dark:
      path: logos/tyler-pollard-header-logo-dark.png
      alt: "Tyler Pollard dark"
    header-logo-light:
      path: logos/tyler-pollard-header-logo-light.png
      alt: "Tyler Pollard light"
  small: icon
  medium: header-logo
    # light: header-logo-on-light
    # dark: header-logo-on-dark
  large: header-logo
    # If you add dedicated variants later:
    # dark: header-logo-on-dark
    # light: header-logo-on-light

color:
  palette:
    # Core neutrals
    ink: "#0E0225"          # deep indigo / near-black (dark backgrounds)
    paper: "#FBF8FF"        # soft off-white (light backgrounds)

    # Miami Vice / retro core
    vice-purple: "#6B2EFF"  # saturated but printable purple
    vice-pink: "#FF5BC8"    # neon pink accent
    vice-teal: "#00E5D4"    # cyan-teal accent

    # Sports + analytics warmth
    sunset-orange: "#FF7A1A"
    gold: "#FFC857"

    # Utility
    muted-gray: "#7A728C"

  # Theme roles
  # Leave foreground/background unset so flatly/darkly keep distinct light/dark body colors.
  # foreground:
  # background:

  primary: vice-purple
  secondary: gold
  tertiary: vice-teal

  success: vice-teal
  info: gold
  warning: sunset-orange
  danger: vice-pink

  light: paper
  dark: ink

typography:
  fonts:
    # Primary brand font (retro-modern, excellent numerals)
    - family: Space Grotesk
      source: google
      weight: [400, 500, 600, 700]
      style: [normal]

    # Monospace for code, stats, tables
    - family: JetBrains Mono
      source: google
      weight: [400, 600]
      style: [normal, italic]

  base:
    family: Space Grotesk
    weight: 400
    size: 1rem
    line-height: 1.55
    # color intentionally inherited from the active Bootstrap theme

  headings:
    family: Space Grotesk
    weight: 600
    line-height: 1.2
    color: vice-pink

  monospace:
    family: JetBrains Mono
    weight: 400
    size: 0.9em

  monospace-inline:
    # color: vice-teal
    background-color: paper #"#F2ECFF"

  monospace-block:
    # color: ink
    background-color: paper #"#F4F0FF"
    line-height: 1.45

  link:
    weight: 600
    color: gold
    decoration: underline

defaults:
  bootstrap:
    # Bootstrap 5 placeholders (safe to keep empty until needed)
    # defaults: 
      # title-block-banner: $tertiary
    rules: |
      /* Global navbar logo sizing (applies to Quarto + bslib Bootstrap navbars) */
      .navbar-brand .navbar-logo,
      .navbar-brand img {
        max-height: 40px;
        width: auto;
      }
    # functions: ""
    # mixins: ""
  quarto:
    format:
      # Quarto format placeholders (keep allowed formats only)
      # html: {}
      # dashboard: {}
      # revealjs: {}
      typst:
        papersize: us-letter
  shiny:
    # Shiny/bslib placeholders
    theme:
      # defaults: {}
      rules: ""
