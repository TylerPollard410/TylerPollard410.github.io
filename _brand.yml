meta:
  name: Tyler Pollard
  description: "Statistician and operations research analyst focused on Bayesian modeling, predictive analytics, and data visualization."
  link:
    # home: https://your-domain.com # TODO: add your main site URL
    github: https://github.com/TylerPollard410
    linkedin: https://www.linkedin.com/in/tyler-pollard-763b8315b/
    email: mailto:tylerpollard410@gmail.com

logo:
  # Logo files live in logos/ next to _brand.yml. Replace with final assets.
  images:
    icon:
      path: logos/tyler-pollard-icon.png
      alt: "TP icon"
    wordmark-on-dark:
      path: logos/tyler-pollard-wordmark-on-dark.png
      alt: "Tyler Pollard wordmark for dark backgrounds"
    wordmark-on-light:
      path: logos/tyler-pollard-wordmark-on-light.png
      alt: "Tyler Pollard wordmark for light backgrounds"
    lockup:
      path: logos/tyler-pollard-lockup.png
      alt: "Tyler Pollard logo lockup"
  small: icon
  medium:
    dark: wordmark-on-dark
    light: wordmark-on-light
  large: lockup

color:
  palette:
    # Core neutrals
    ink: "#0E0225"          # deep indigo / near-black (dark backgrounds)
    paper: "#FBF8FF"        # soft off-white (light backgrounds)

    # Miami Vice / retro core
    vice-purple: "#6B2EFF"  # saturated but printable purple
    vice-pink: "#FF5BC8"    # neon pink accent
    vice-teal: "#00E5D4"    # cyan-teal accent

    # Sports + analytics warmth
    sunset-orange: "#FF7A1A"
    gold: "#FFC857"

    # Utility
    muted-gray: "#7A728C"

  # Theme roles
  # Leave foreground/background unset so flatly/darkly keep distinct light/dark body colors.

  primary: vice-purple
  secondary: vice-teal
  tertiary: vice-pink

  success: vice-teal
  info: vice-purple
  warning: sunset-orange
  danger: vice-pink

  light: paper
  dark: ink

