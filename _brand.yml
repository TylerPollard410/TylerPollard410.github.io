typography:
  fonts:
    # Primary brand font (retro-modern, excellent numerals)
    - family: Space Grotesk
      source: google
      weight: [400, 500, 600, 700]
      style: [normal]

    # Monospace for code, stats, tables
    - family: JetBrains Mono
      source: google
      weight: [400, 600]
      style: [normal, italic]

  base:
    family: Space Grotesk
    weight: 400
    size: 1rem
    line-height: 1.55
    # color intentionally inherited from the active Bootstrap theme

  headings:
    family: Space Grotesk
    weight: 600
    line-height: 1.2
    color: vice-purple

  monospace:
    family: JetBrains Mono
    weight: 400
    size: 0.9em

  monospace-inline:
    color: vice-pink
    background-color: "#F2ECFF"

  monospace-block:
    color: ink
    background-color: "#F4F0FF"
    line-height: 1.45

  link:
    weight: 600
    color: vice-teal
    decoration: underline

defaults:
  quarto:
    format:
      pdf:
        documentclass: scrartcl
      typst:
        papersize: us-letter

  shiny:
    theme:
      defaults:
        navbar-bg: $brand-ink
        navbar-fg: $brand-paper
        primary: $brand-vice-purple
      rules: |
        .navbar-brand img {
          max-height: 48px;
        }
